# Build Application
name: Build Auth Manager SpringBoot application

on: push

jobs:
  build:
    name: Build SpringBoot application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Create JWT key files
        run: |
          mkdir -p authorization-app/src/main/resources/keys
          printf '%s\n' "${JWT_PRIVATE_KEY_PEM}" > authorization-app/src/main/resources/keys/private-key.pem
          printf '%s\n' "${JWT_PUBLIC_KEY_PEM}" > authorization-app/src/main/resources/keys/public-key.pem
        env:
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}

      - name: Verify JWT key files exist
        run: |
          ls -l authorization-app/src/main/resources/keys
          test -s authorization-app/src/main/resources/keys/private-key.pem
          test -s authorization-app/src/main/resources/keys/public-key.pem

      - name: Unit Tests
        run: mvn -B test --file pom.xml

      - name: Build the application
        run: |
          mvn clean
          mvn -B package --file pom.xml